# =========================
#  LIQUID GLASS PICOM
# =========================

backend = "glx";
vsync = true;

# Shadows (soft floating feel)
shadow = true;
shadow-radius = 25;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";

# Opacity rules
active-opacity = 1.0;
inactive-opacity = 0.65;
frame-opacity = 0.9;
inactive-opacity-override = true;

# Fading (smooth transitions)
fading = true;
fade-delta = 4;

# Blur (THE glass effect)
blur-method = "dual_kawase";
blur-strength = 4;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

# Transparency rules (adjusts glass feel)
opacity-rule = [
  "90:class_g = 'i3-frame'",
  "95:class_g = 'kitty'",
  "85:class_g = 'Dolphin'",
  "100:class_g = 'rofi'"
];

# Corners (soft glass look)
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Performance + stability
use-damage = false;
unredir-if-possible = false;
