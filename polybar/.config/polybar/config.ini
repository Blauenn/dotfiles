[bar/main]
width = 100%
height = 36
line-size = 0
border-size = 0
padding-left = 2
padding-right = 2

background = #0f0f14
foreground = #e6e6e6

font-0 = JetBrainsMono Nerd Font:size=10.5;2
font-1 = Noto Color Emoji:scale=8;1

tray-maxsize = 32

modules-left = icon user cpu memory gpu i3mode
modules-center = workspaces
modules-right = tray date

module-margin = 1

enable-ipc = true

[module/icon]
type = custom/text
content = "🦄"
content-font = 2

[module/user]
type = custom/script
exec = whoami
interval = 60
content-font = 2

[module/i3mode]
type = internal/i3
format = <label-mode>
label-mode = - [%mode%s]

[module/cpu]
type = internal/cpu
interval = 1
format = "CPU: <label>"
label = %percentage%%
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = "MEM: <label>"
label = %percentage_used%%
format-padding = 1

[module/gpu]
type = custom/script
exec = ~/.config/polybar/gpu.sh
interval = 2

[module/workspaces]
type = internal/i3

pin-workspaces = false
strip-wsnumbers = false

index-sort = true
enable-click = true
enable-scroll = true

format = <label-state>

label-focused = %index%
label-focused-background = #ec4194
label-focused-foreground = #ffffff
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = #b5c731
label-urgent-foreground = #000000
label-urgent-padding = 2

[module/tray]
type = internal/tray

tray-padding = 8

[module/date]
type = internal/date
interval = 1
date = %a. %d %b
time = %H:%M:%S
label = %date% %time%
